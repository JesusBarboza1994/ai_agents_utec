name: Execute evaluations

# Dos formas de correrlo:
#   - A demanda (workflow_dispatch): pestana Actions -> "Execute evaluations".
#   - Como paso previo del deploy (workflow_call): deploy-azure.yml lo llama antes
#     de construir y desplegar; si este workflow falla, el deploy no corre.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag o ref a evaluar (ej. v0.2.0). Vacio = usa el branch/tag desde el que se dispara el workflow."
        required: false
      suites:
        description: "Suites separadas por espacio (security conversation quality trajectory rag safety). Vacio = todas."
        required: false
  workflow_call:
    inputs:
      tag:
        description: "Tag o ref a evaluar."
        required: true
        type: string
      suites:
        description: "Suites separadas por espacio. Vacio = todas."
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: evals-clemente-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

defaults:
  run:
    # El codigo y los evaluadores de Clemente viven en esta subcarpeta del
    # monorepo, no en la raiz del repo.
    working-directory: Clemente_Multiagente

jobs:
  evaluar:
    name: Correr evaluadores (LangSmith)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias (runtime + eval)
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Correr los evaluadores contra la config real de produccion
        # Mismas variables que usa caclmt01 en produccion (ver Container App):
        # el codigo evaluado corre sobre los mismos backends de Azure OpenAI y
        # Azure Search que produccion, asi que lo que miden estos evaluadores
        # es el comportamiento real del agente, no de un mock.
        env:
          AGENT_MODEL: azure
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_EMBEDDINGS_DEPLOYMENT: ${{ vars.AZURE_OPENAI_EMBEDDINGS_DEPLOYMENT }}
          RAG_BACKEND: azure_search
          EMBEDDINGS_BACKEND: azure
          AZURE_SEARCH_ENDPOINT: ${{ vars.AZURE_SEARCH_ENDPOINT }}
          AZURE_SEARCH_INDEX: ${{ vars.AZURE_SEARCH_INDEX }}
          AZURE_SEARCH_API_KEY: ${{ secrets.AZURE_SEARCH_API_KEY }}
          # json = archivo local del checkout, efimero por corrida: no toca
          # ningun dato compartido ni de produccion (ver nota en el README del
          # eval sobre por que es seguro correr esto contra credenciales reales).
          CLEMENTE_BACKEND_RESERVAS: json
          CLEMENTE_BACKEND_INCIDENCIAS: json
          LANGSMITH_TRACING: "true"
          LANGSMITH_PROJECT: ${{ vars.LANGSMITH_PROJECT }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          # Juez Claude de las evaluaciones (ver tests/evals/modelo_juez.py).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Por variable de entorno y no interpolado en el script: es texto libre
          # del usuario. El evaluador rechaza (exit 1) cualquier suite desconocida.
          SUITES: ${{ inputs.suites }}
        run: |
          echo "::group::LangSmith (${SUITES:-todas las suites})"
          read -ra suites <<< "$SUITES"   # cada palabra es un argumento; vacio = todas
          python3 tests/evals/langsmith/evaluador_langsmith.py "${suites[@]}"
          echo "::endgroup::"

      # Sin artifacts: los resultados (scores y comentarios del juez) se revisan en
      # los experimentos de LangSmith.
