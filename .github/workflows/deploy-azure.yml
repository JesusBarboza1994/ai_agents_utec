name: CI/CD Clemente -> Azure Container Apps

on:
  pull_request:
    branches: [main]
    paths:
      - "Clemente_Multiagente/**"
      - ".github/workflows/deploy-azure.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a desplegar (ver pestana Tags del repo, ej. v0.2.0)"
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-clemente-${{ github.ref }}
  cancel-in-progress: false   # nunca cancelar un despliegue a mitad de camino

defaults:
  run:
    # El Dockerfile y todo el codigo de Clemente viven en esta subcarpeta del
    # monorepo, no en la raiz del repo -- sin esto, "docker build ." construiria
    # desde la raiz y no encontraria el Dockerfile.
    working-directory: Clemente_Multiagente

jobs:
  validar-pr:
    name: Validar PR (build de la imagen, sin desplegar)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Construir la imagen (solo valida que el Dockerfile compila)
        run: docker build -t clemente:pr-${{ github.event.pull_request.number }} .

  build-and-deploy:
    name: Build y despliegue a Azure
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout del tag elegido
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Login en Azure (OIDC, sin secreto de cliente)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Construir la imagen y subirla a ACR
        run: |
          az acr login --name ${{ vars.AZURE_ACR_NAME }}
          if az acr repository show --name ${{ vars.AZURE_ACR_NAME }} \
               --image clemente:${{ github.event.inputs.tag }} >/dev/null 2>&1; then
            echo "clemente:${{ github.event.inputs.tag }} ya existe en ACR, se reusa sin reconstruir (ej. un rollback)."
          else
            docker build \
              -t ${{ vars.AZURE_ACR_NAME }}.azurecr.io/clemente:${{ github.event.inputs.tag }} \
              -t ${{ vars.AZURE_ACR_NAME }}.azurecr.io/clemente:latest \
              .
            docker push ${{ vars.AZURE_ACR_NAME }}.azurecr.io/clemente:${{ github.event.inputs.tag }}
            docker push ${{ vars.AZURE_ACR_NAME }}.azurecr.io/clemente:latest
          fi

      - name: Desplegar la nueva revision en Container Apps
        run: |
          az containerapp update \
            --name ${{ vars.AZURE_CONTAINERAPP_NAME }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --image ${{ vars.AZURE_ACR_NAME }}.azurecr.io/clemente:${{ github.event.inputs.tag }}

  evaluar-release:
    name: Evaluar el release desplegado (DeepEval + LangSmith)
    needs: build-and-deploy
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    # Solo informativo: el release ya esta desplegado cuando esto corre, asi
    # que un score bajo no revierte nada -- queda el reporte para revisar.
    steps:
      - name: Checkout del tag desplegado
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias (runtime + eval)
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Correr los evaluadores contra la config real del release
        # Mismas variables que usa caclmt01 en produccion (ver Container App):
        # el codigo del tag corre sobre los mismos backends de Azure OpenAI y
        # Azure Search que el release desplegado, asi que lo que miden estos
        # evaluadores es el comportamiento real de ESTE release, no de un mock.
        env:
          AGENT_MODEL: azure
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_EMBEDDINGS_DEPLOYMENT: ${{ vars.AZURE_OPENAI_EMBEDDINGS_DEPLOYMENT }}
          RAG_BACKEND: azure_search
          EMBEDDINGS_BACKEND: azure
          AZURE_SEARCH_ENDPOINT: ${{ vars.AZURE_SEARCH_ENDPOINT }}
          AZURE_SEARCH_INDEX: ${{ vars.AZURE_SEARCH_INDEX }}
          AZURE_SEARCH_API_KEY: ${{ secrets.AZURE_SEARCH_API_KEY }}
          # json = archivo local del checkout, efimero por corrida: no toca
          # ningun dato compartido ni de produccion (ver nota en el README del
          # eval sobre por que es seguro correr esto contra credenciales reales).
          CLEMENTE_BACKEND_RESERVAS: json
          CLEMENTE_BACKEND_INCIDENCIAS: json
          LANGSMITH_TRACING: "true"
          LANGSMITH_PROJECT: ${{ vars.LANGSMITH_PROJECT }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
        run: |
          echo "::group::DeepEval (metricas nativas)"
          python3 tests/evals/deepeval/evaluador_deepeval.py
          echo "::endgroup::"

          echo "::group::LangSmith (LLM-as-judge propio + enrutamiento)"
          python3 tests/evals/langsmith/evaluador_langsmith.py
          echo "::endgroup::"

      - name: Publicar reportes como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-clemente-${{ github.event.inputs.tag }}
          path: |
            Clemente_Multiagente/tests/evals/deepeval/reportes/
            Clemente_Multiagente/tests/evals/langsmith/reportes/
          if-no-files-found: warn

