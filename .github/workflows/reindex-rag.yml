name: Reindexar RAG en Azure AI Search

# Push manual de los dos indices RAG de Clemente a Azure AI Search. La fuente de
# ambos es Azure Blob Storage (cuenta del secreto AZURE_STORAGE_CONNECTION_STRING):
#   - catalogo     contenedor "catalogo"     -> app/agentes/rag/indice_catalogo.py    -> indice catalogo-clemente
#   - incidencias  contenedor "incidencias"  -> app/agentes/rag/indice_incidencias.py -> indice incidencias-clemente
# No hay cron ni deteccion automatica de cambios: correr esto a mano (pestana
# Actions -> Run workflow) despues de subir o editar documentos en el Blob.
#
# Los scripts hacen el chunking, piden los embeddings a Azure OpenAI y suben los
# chunks con API keys -- no usan "az" CLI, asi que este workflow no necesita el
# login OIDC que si usa deploy-azure.yml.

on:
  workflow_dispatch:
    inputs:
      indices:
        description: "Indices a reindexar"
        type: choice
        options: [todos, catalogo, incidencias]
        default: todos
      ref:
        description: "Rama o tag del codigo de ingesta (los documentos salen del Blob, no del repo)"
        required: false
        default: main

permissions:
  contents: read

defaults:
  run:
    working-directory: Clemente_Multiagente

jobs:
  reindexar:
    name: Push de los indices RAG a Azure AI Search
    runs-on: ubuntu-latest
    environment: production
    env:
      RAG_BACKEND: azure_search
      AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
      AZURE_SEARCH_ENDPOINT: ${{ vars.AZURE_SEARCH_ENDPOINT }}
      AZURE_SEARCH_API_KEY: ${{ secrets.AZURE_SEARCH_API_KEY }}
      EMBEDDINGS_BACKEND: azure
      AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_EMBEDDINGS_DEPLOYMENT: ${{ vars.AZURE_OPENAI_EMBEDDINGS_DEPLOYMENT }}
      AZURE_OPENAI_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        # requirements.txt completo, no un subconjunto: "python -m app.agentes.rag..."
        # importa el paquete app.agentes, y app/agentes/__init__.py trae todo el
        # stack de agentes (incidencias, reservas) al nivel del paquete -- no hay
        # forma de aislar solo el RAG sin instalar practicamente todo igual.
        run: pip install --no-cache-dir -r requirements.txt

      - name: Reindexar el catalogo (catalogo-clemente)
        if: github.event.inputs.indices != 'incidencias'
        env:
          AZURE_SEARCH_INDEX: ${{ vars.AZURE_SEARCH_INDEX }}
        run: python -m app.agentes.rag.indice_catalogo

      - name: Reindexar los casos de incidencias (incidencias-clemente)
        if: github.event.inputs.indices != 'catalogo'
        run: python -m app.agentes.rag.indice_incidencias
